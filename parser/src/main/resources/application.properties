spring.application.name=watchtower
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.session.store-type=none
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.servlet.multipart.max-file-size=4MB
# Keep the full multipart body below Lambda's 6MB synchronous request limit after
# API Gateway base64 encoding and proxy-event overhead.
spring.servlet.multipart.max-request-size=4400KB
# API Gateway accepts at most 10MB. Drain locally rejected requests up to that
# ingress cap so ordinary oversized uploads receive the structured 413.
server.tomcat.max-swallow-size=10MB
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.mvc.log-request-details=false
server.forward-headers-strategy=framework
