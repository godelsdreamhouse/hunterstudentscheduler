name: Frontend tests

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontend-tests.yml'
      - 'src/**'
      - 'e2e/**'
      - 'index.html'
      - 'public/**'
      - '.npmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
      - 'vite.config.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Install Chrome for browser tests
        run: npx playwright install --with-deps chrome

      - name: Run synthetic browser journeys
        run: npm run test:e2e

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
