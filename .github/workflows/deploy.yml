name: Deploy application

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bootstrap_images_only:
        description: Push images and secrets before the one-time infrastructure bootstrap
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-pr-{0}', github.event.pull_request.number) || 'deploy-production' }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '134604497934'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Test backend
        working-directory: backend
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check scheduler and infrastructure
        run: |
          python -m compileall -q schedulingLogic
          python -m pip install --disable-pip-version-check cfn-lint
          cfn-lint infrastructure/template.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile parser
        working-directory: parser
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      - name: Build Lambda container images
        run: |
          docker build -f backend/Dockerfile -t hunter-scheduler-web:test .
          docker build -f schedulingLogic/Dockerfile -t hunter-scheduler-solver:test .
          docker build -f parser/Dockerfile -t hunter-scheduler-parser:test .

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment secrets
        env:
          WEB_DATABASE_PASSWORD: ${{ secrets.WEB_DATABASE_PASSWORD }}
          COMPUTE_DATABASE_PASSWORD: ${{ secrets.COMPUTE_DATABASE_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
        run: |
          for name in WEB_DATABASE_PASSWORD COMPUTE_DATABASE_PASSWORD SESSION_SECRET MICROSOFT_CLIENT_ID MICROSOFT_TENANT_ID MICROSOFT_CLIENT_SECRET; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134604497934:role/hunter-scheduler-github-deploy
          aws-region: us-east-1
          role-session-name: deploy-${{ github.run_id }}

      - name: Store application secrets in AWS
        env:
          WEB_DATABASE_PASSWORD: ${{ secrets.WEB_DATABASE_PASSWORD }}
          COMPUTE_DATABASE_PASSWORD: ${{ secrets.COMPUTE_DATABASE_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
        run: |
          umask 077
          jq -n \
            --arg password "$WEB_DATABASE_PASSWORD" \
            --arg session "$SESSION_SECRET" \
            --arg microsoft_client_id "$MICROSOFT_CLIENT_ID" \
            --arg microsoft_tenant_id "$MICROSOFT_TENANT_ID" \
            --arg microsoft_client_secret "$MICROSOFT_CLIENT_SECRET" \
            '{password: $password, session_secret: $session, microsoft_client_id: $microsoft_client_id, microsoft_tenant_id: $microsoft_tenant_id, microsoft_client_secret: $microsoft_client_secret}' > "$RUNNER_TEMP/web-secret.json"
          jq -n --arg password "$COMPUTE_DATABASE_PASSWORD" \
            '{password: $password}' > "$RUNNER_TEMP/compute-secret.json"
          for secret in web compute; do
            if aws secretsmanager describe-secret --secret-id "hunter-scheduler/$secret" >/dev/null 2>&1; then
              aws secretsmanager put-secret-value \
                --secret-id "hunter-scheduler/$secret" \
                --secret-string "file://$RUNNER_TEMP/$secret-secret.json" >/dev/null
            else
              aws secretsmanager create-secret \
                --name "hunter-scheduler/$secret" \
                --description "Hunter Scheduler $secret runtime credentials" \
                --secret-string "file://$RUNNER_TEMP/$secret-secret.json" \
                --tags Key=Project,Value=hunterscheduler >/dev/null
            fi
          done
          shred -u "$RUNNER_TEMP/web-secret.json" "$RUNNER_TEMP/compute-secret.json"

      - name: Build and push Lambda images
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          for service in web solver parser; do
            case "$service" in
              web) dockerfile=backend/Dockerfile ;;
              solver) dockerfile=schedulingLogic/Dockerfile ;;
              parser) dockerfile=parser/Dockerfile ;;
            esac
            image="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/hunter-scheduler-$service:$IMAGE_TAG"
            # Lambda requires a single-platform image manifest and rejects the
            # provenance/SBOM attestation index emitted by current BuildKit.
            docker build \
              --platform linux/amd64 \
              --provenance=false \
              --sbom=false \
              -f "$dockerfile" \
              -t "$image" \
              .
            docker push "$image"
          done

      - name: Update Lambda images
        if: inputs.bootstrap_images_only != true
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}
        run: |
          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          for service in web solver parser; do
            aws lambda update-function-code \
              --function-name "hunter-scheduler-$service" \
              --image-uri "$registry/hunter-scheduler-$service:$IMAGE_TAG" >/dev/null
          done
          for service in web solver parser; do
            aws lambda wait function-updated-v2 --function-name "hunter-scheduler-$service"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build and upload frontend
        if: inputs.bootstrap_images_only != true
        run: |
          npm ci
          npm run build
          bucket=$(aws cloudformation describe-stacks --stack-name hunter-scheduler-app \
            --query "Stacks[0].Outputs[?OutputKey=='SiteBucketName'].OutputValue" --output text)
          distribution=$(aws cloudformation describe-stacks --stack-name hunter-scheduler-app \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          aws s3 sync dist "s3://$bucket" --delete --cache-control 'public,max-age=300'
          aws s3 cp dist/assets "s3://$bucket/assets" --recursive \
            --cache-control 'public,max-age=31536000,immutable'
          aws cloudfront create-invalidation --distribution-id "$distribution" --paths '/*' >/dev/null

      - name: Smoke test deployed services
        if: inputs.bootstrap_images_only != true
        run: |
          site_url=$(aws cloudformation describe-stacks --stack-name hunter-scheduler-app \
            --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue" --output text)
          api_url=$(aws cloudformation describe-stacks --stack-name hunter-scheduler-app \
            --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" --output text)
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "$site_url/" >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "$site_url/api/health"
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "$site_url/api/schedule/health"
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "$site_url/parser/health"
          # CloudFront rewrites origin 404s to the SPA, so verify the disabled
          # route against API Gateway directly.
          account_status=$(curl --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors \
            --output /tmp/account-route-response --write-out '%{http_code}' \
            "$api_url/api/users/profile")
          if [ "$account_status" != "404" ]; then
            cat /tmp/account-route-response
            echo "::error::Expected disabled account route to return 404; got $account_status"
            exit 1
          fi
          echo "Deployed $site_url"
